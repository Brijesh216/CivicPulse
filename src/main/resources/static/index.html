<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grievance Reporter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="ui-card shadow-md p-5" style="width: 100%; max-width: 500px;">
        <div class="text-center mb-4">
            <div class="d-flex align-items-center justify-content-center mb-2">
                <span class="pgr-icon me-2 fs-5 px-2 py-1">PGR</span>
                <h3 class="m-0 fw-bold text-dark">Grievance Reporter</h3>
            </div>
            <p class="text-muted mt-2">Sign in or create an account</p>
        </div>

        <ul class="nav nav-pills mb-3 justify-content-center" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab">Login</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab">Register</button>
            </li>
        </ul>

        <div class="tab-content" id="pills-tabContent">
            <!-- Login -->
            <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" class="form-control" id="loginEmail" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn-primary-action w-100 shadow-sm mt-2">Sign In</button>
                </form>
            </div>

            <!-- Register -->
            <div class="tab-pane fade" id="pills-register" role="tabpanel">
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="regName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" class="form-control" id="regEmail" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="regPassword" required>
                    </div>
                    <button type="submit" class="btn-primary-action w-100 shadow-sm mt-2">Sign Up</button>
                </form>
            </div>
        </div>
        <div id="alertMsg" class="alert d-none mt-3" role="alert"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    checkAccess();



    function showAlert(msg, type='danger') {
        const am = document.getElementById('alertMsg');
        am.className = `alert alert-${type} mt-3`;
        am.textContent = msg;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
        };
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (res.ok && data.token) {
                setAuthAction(data.token, data);
                if (data.role === 'ROLE_CITIZEN') window.location.href='/citizen.html';
                else if (data.role === 'ROLE_OFFICER') window.location.href='/officer.html';
                else if (data.role === 'ROLE_ADMIN') window.location.href='/admin.html';
            } else {
                showAlert(data.message || 'Login failed');
            }
        } catch(e) {
            showAlert('Login error');
        }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value
        };

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (res.ok) {
                showAlert('Registration successful! You can now login.', 'success');
                document.getElementById('registerForm').reset();
            } else {
                const data = await res.json();
                showAlert(data.message || 'Registration failed');
            }
        } catch(e) {
            showAlert('Registration error');
        }
    });
</script>
</body>
</html>
